name: Release

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Validate release tag matches package version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version ($VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Test
        run: bun test

      - name: Extract changelog for release
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          awk -v ver="$VERSION" '
            BEGIN { found=0; heading="[" ver "]" }
            /^## \[/ {
              if (found) exit
              if (index($0, heading) > 0) {
                found=1
                print
              }
              next
            }
            found { print }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "No changelog section found for version $VERSION"
            exit 1
          fi

      - name: Update GitHub release notes from changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "${{ github.event.release.tag_name }}" \
            --repo "${{ github.repository }}" \
            --notes-file release-notes.md

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Check if version already exists on npm
        id: npm-check
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          OUTPUT=""
          STATUS=0
          OUTPUT=$(npm view "react-render-switch@${VERSION}" version 2>&1) || STATUS=$?

          if [ "$STATUS" -eq 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Version already published to npm; skipping publish."
          elif echo "$OUTPUT" | grep -qiE 'E404|404 Not Found|not found'; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "$OUTPUT"
            exit 1
          fi

      - name: Publish to npm
        if: steps.npm-check.outputs.exists != 'true' && !github.event.release.prerelease
        run: npm publish

      - name: Skip npm publish for pre-releases
        if: github.event.release.prerelease
        run: echo "Pre-release; skipping npm publish."
